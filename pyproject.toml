[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "game-title-researcher"
version = "1.1.0"
description = "A portable Agent Skill and CLI tool for video game developers to research title availability, detect naming conflicts, and assess trademark risks."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mahmut Baysağ", email = "mbaysag1080@gmail.com" },
    { name = "Antigravity (Google DeepMind)" },
]
requires-python = ">=3.10"
dependencies = [
    "rapidfuzz>=3.0",
    "jellyfish>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
keywords = [
    "game-development",
    "indie-games",
    "agent-skills",
    "trademark",
    "steam",
    "app-store",
    "gog",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.22",
    "ruff>=0.15",
]

[project.scripts]
game-title-researcher = "scripts.cli:main"

[project.urls]
Homepage = "https://github.com/mahmutbaysag/game-title-researcher"
Repository = "https://github.com/mahmutbaysag/game-title-researcher"
Issues = "https://github.com/mahmutbaysag/game-title-researcher/issues"
Changelog = "https://github.com/mahmutbaysag/game-title-researcher/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]
